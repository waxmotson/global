name = "hintergrid-rooms"
main = "src/index.js"
compatibility_date = "2025-06-01"

# One Durable Object per challenge room. SQLite-backed objects are available
# on the Workers free plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional: lock the API to your site, comma separated.
# [vars]
# ALLOWED_ORIGINS = "https://example.com,http://localhost:3000"
